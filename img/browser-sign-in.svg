<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><title>Browser sign-in: the easiest starting point</title><rect x="0" y="0" width="1200" height="560" rx="20" fill="#0e1826" stroke="none"/><text x="44" y="57" font-family="Arial, sans-serif" font-size="30" fill="#fff" font-weight="700">Browser sign-in: the easiest starting point</text><text x="44" y="96" font-family="Arial, sans-serif" font-size="18" fill="#a7b9cd" font-weight="400">Instructional illustration  /  actual screens may look different</text><rect x="44" y="135" width="510" height="351" rx="14" fill="#f5f7fa" stroke="none"/><text x="80" y="174" font-family="Arial, sans-serif" font-size="18" fill="#536373" font-weight="400">Git Credential Manager</text><text x="238" y="220" font-family="Arial, sans-serif" font-size="28" fill="#172b3b" font-weight="700">GitHub</text><text x="246" y="259" font-family="Arial, sans-serif" font-size="24" fill="#172b3b" font-weight="400">Sign in</text><text x="98" y="307" font-family="Arial, sans-serif" font-size="20" fill="#0969da" font-weight="700">Browser</text><text x="300" y="307" font-family="Arial, sans-serif" font-size="20" fill="#647484" font-weight="400">Token</text><rect x="82" y="330" width="434" height="60" rx="8" fill="#16714d" stroke="none"/><text x="132" y="368" font-family="Arial, sans-serif" font-size="24" fill="#fff" font-weight="700">Sign in with your browser</text><text x="175" y="440" font-family="Arial, sans-serif" font-size="20" fill="#475c70" font-weight="400">Sign in with a code</text><circle cx="634" cy="173" r="19" fill="#48d6b0"/><text x="628" y="180" font-family="Arial, sans-serif" font-size="19" fill="#10202c" font-weight="700">1</text><text x="670" y="180" font-family="Arial, sans-serif" font-size="25" fill="#fff" font-weight="700">Choose browser sign-in</text><text x="670" y="216" font-family="Arial, sans-serif" font-size="20" fill="#b2c4d6" font-weight="400">In the window opened by Git.</text><circle cx="634" cy="281" r="19" fill="#48d6b0"/><text x="628" y="288" font-family="Arial, sans-serif" font-size="19" fill="#10202c" font-weight="700">2</text><text x="670" y="288" font-family="Arial, sans-serif" font-size="25" fill="#fff" font-weight="700">Finish on GitHub</text><text x="670" y="324" font-family="Arial, sans-serif" font-size="20" fill="#b2c4d6" font-weight="400">Your account, 2FA and authorisation.</text><circle cx="634" cy="389" r="19" fill="#48d6b0"/><text x="628" y="396" font-family="Arial, sans-serif" font-size="19" fill="#10202c" font-weight="700">3</text><text x="670" y="396" font-family="Arial, sans-serif" font-size="25" fill="#fff" font-weight="700">Return to Git Bash</text><text x="670" y="432" font-family="Arial, sans-serif" font-size="20" fill="#b2c4d6" font-weight="400">Wait for the clone to finish.</text><text x="44" y="527" font-family="Arial, sans-serif" font-size="21" fill="#72edc5" font-weight="400">Already signed in? The clone may finish without asking you again.</text></svg>