<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550"><title>Optional token: where to paste it</title><rect x="0" y="0" width="1200" height="550" rx="20" fill="#0e1826" stroke="none"/><text x="44" y="57" font-family="Arial, sans-serif" font-size="30" fill="#fff" font-weight="700">Optional token: where to paste it</text><text x="44" y="96" font-family="Arial, sans-serif" font-size="18" fill="#a7b9cd" font-weight="400">Instructional illustration  /  no real token appears here</text><rect x="44" y="135" width="510" height="342" rx="14" fill="#f5f7fa" stroke="none"/><text x="80" y="174" font-family="Arial, sans-serif" font-size="18" fill="#536373" font-weight="400">Git Credential Manager</text><text x="238" y="220" font-family="Arial, sans-serif" font-size="28" fill="#172b3b" font-weight="700">GitHub</text><text x="246" y="259" font-family="Arial, sans-serif" font-size="24" fill="#172b3b" font-weight="400">Sign in</text><text x="98" y="302" font-family="Arial, sans-serif" font-size="20" fill="#647484" font-weight="400">Browser</text><text x="300" y="302" font-family="Arial, sans-serif" font-size="20" fill="#0969da" font-weight="700">Token</text><rect x="82" y="322" width="434" height="52" rx="6" fill="#fff" stroke="#0969da"/><text x="104" y="355" font-family="Arial, sans-serif" font-size="24" fill="#172b3b" font-weight="400">••••••••••••••••••••</text><rect x="213" y="398" width="170" height="51" rx="8" fill="#16714d" stroke="none"/><text x="260" y="431" font-family="Arial, sans-serif" font-size="23" fill="#fff" font-weight="700">Sign in</text><circle cx="634" cy="178" r="19" fill="#48d6b0"/><text x="628" y="185" font-family="Arial, sans-serif" font-size="19" fill="#10202c" font-weight="700">1</text><text x="670" y="185" font-family="Arial, sans-serif" font-size="25" fill="#fff" font-weight="700">Open the Token tab</text><text x="670" y="221" font-family="Arial, sans-serif" font-size="20" fill="#b2c4d6" font-weight="400">If this option is available.</text><circle cx="634" cy="279" r="19" fill="#48d6b0"/><text x="628" y="286" font-family="Arial, sans-serif" font-size="19" fill="#10202c" font-weight="700">2</text><text x="670" y="286" font-family="Arial, sans-serif" font-size="25" fill="#fff" font-weight="700">Paste your PAT</text><text x="670" y="322" font-family="Arial, sans-serif" font-size="20" fill="#b2c4d6" font-weight="400">Use the credential field shown here.</text><circle cx="634" cy="380" r="19" fill="#48d6b0"/><text x="628" y="387" font-family="Arial, sans-serif" font-size="19" fill="#10202c" font-weight="700">3</text><text x="670" y="387" font-family="Arial, sans-serif" font-size="25" fill="#fff" font-weight="700">Select Sign in</text><text x="670" y="423" font-family="Arial, sans-serif" font-size="20" fill="#b2c4d6" font-weight="400">Then return to your Git command.</text><text x="44" y="519" font-family="Arial, sans-serif" font-size="21" fill="#72edc5" font-weight="400">Keep the token out of your commands, remote URL and project files.</text></svg>