<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><title>Your everyday Git routine</title><rect x="0" y="0" width="1200" height="440" rx="20" fill="#0e1826" stroke="none"/><text x="44" y="57" font-family="Arial, sans-serif" font-size="30" fill="#fff" font-weight="700">Your everyday Git routine</text><text x="44" y="96" font-family="Arial, sans-serif" font-size="18" fill="#a7b9cd" font-weight="400">Git Bash  /  inside your project folder</text><text x="48" y="158" font-family="Consolas, monospace" font-size="27" fill="#72edc5" font-weight="400">$ git pull --ff-only</text><text x="48" y="207" font-family="Consolas, monospace" font-size="27" fill="#a7b9cd" font-weight="400"># Edit and save your file</text><text x="48" y="256" font-family="Consolas, monospace" font-size="27" fill="#72edc5" font-weight="400">$ git add hello.txt</text><text x="48" y="305" font-family="Consolas, monospace" font-size="27" fill="#72edc5" font-weight="400">$ git commit -m "Update my greeting"</text><text x="48" y="354" font-family="Consolas, monospace" font-size="27" fill="#72edc5" font-weight="400">$ git push</text><text x="48" y="414" font-family="Arial, sans-serif" font-size="17" fill="#a7b9cd" font-weight="400">DOWNLOAD THE LATEST     ·     RECORD YOUR CHANGE     ·     UPLOAD YOUR WORK</text></svg>