tents: Read and write</text><rect x="78" y="560" width="230" height="52" rx="8" fill="#16714d" stroke="none"/><text x="110" y="593" font-family="Arial, sans-serif" font-size="23" fill="#fff" font-weight="700">Generate token</text><text x="344" y="593" font-family="Arial, sans-serif" font-size="21" fill="#536373" font-weight="400">Save it privately in your password manager.</text></svg>